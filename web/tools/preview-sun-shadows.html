<!doctype html>
<html>
  <body style="margin: 0; background: #181818; color: white; font: 16px sans-serif">
    <div id="controls"></div>
    <canvas id="preview"></canvas>
    <script type="module">
      import * as T from 'three';
      import { SunShadows } from '/src/ui/sunShadows.ts';
      const renderer = new T.WebGLRenderer({ canvas: document.querySelector('canvas'), antialias: false });
      renderer.setSize(900, 650);
      renderer.setClearColor('#222');
      const scene = new T.Scene();
      const camera = new T.OrthographicCamera(-3.5, 3.5, 2.5, -2.5, 0.1, 100);
      camera.up.set(0, 0, 1);
      camera.position.set(3, -5, 7);
      camera.lookAt(0, 0, 0);
      const texture = await new T.TextureLoader().loadAsync('/graphics/Standard-TreeCards.png');
      texture.magFilter = T.NearestFilter;
      texture.minFilter = T.NearestFilter;
      const sun = new SunShadows(texture, texture, texture);
      scene.add(sun.trees.mesh);
      sun.setGround(
        null,
        Array.from({ length: 49 }, () => ({ base: 2 })),
      );
      scene.add(new T.Mesh(new T.PlaneGeometry(7, 7), new T.MeshBasicMaterial({ color: '#b8be8a' })));
      const geo = new T.PlaneGeometry(1, 1);
      const uv = geo.getAttribute('uv');
      for (let i = 0; i < uv.count; i++) uv.setX(i, uv.getX(i) / 3);
      const tree = new T.Mesh(
        geo,
        new T.MeshBasicMaterial({ map: texture, transparent: true, alphaTest: 0.01, depthWrite: false, side: T.DoubleSide }),
      );
      tree.renderOrder = 0.9;
      scene.add(tree);
      const anchor = [20 / 64, 1 - 35 / 64];
      function face() {
        tree.quaternion.copy(camera.quaternion);
        const right = new T.Vector3(1, 0, 0).applyQuaternion(camera.quaternion),
          up = new T.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
        tree.position
          .set(0, 0, 0.002)
          .addScaledVector(right, 0.5 - anchor[0])
          .addScaledVector(up, 0.5 - anchor[1]);
      }
      function show(phase) {
        sun.reset();
        sun.setSun(phase, 12, true);
        sun.trees.add(0, 0, 1, [0, 0, 1 / 3, 1], anchor);
        face();
        renderer.render(scene, camera);
      }
      for (const [name, phase] of [
        ['Morning', 3],
        ['Noon', 4],
        ['Afternoon', 5],
        ['Night', 0],
      ]) {
        const b = document.createElement('button');
        b.textContent = name;
        b.onclick = () => show(phase);
        document.querySelector('#controls').append(b);
      }
      const rotate = document.createElement('button');
      rotate.textContent = 'Rotate camera';
      rotate.onclick = () => {
        camera.position.x *= -1;
        camera.position.y *= -1;
        camera.lookAt(0, 0, 0);
        face();
        renderer.render(scene, camera);
      };
      document.querySelector('#controls').append(rotate);
      show(3);
    </script>
  </body>
</html>
