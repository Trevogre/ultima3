<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sprite sheet</title>
    <link rel="icon" href="pwa-192.png" type="image/png" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #111;
        color: #ddd;
        font:
          14px/1.4 -apple-system,
          'Segoe UI',
          Helvetica,
          Arial,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        align-items: center;
        padding: 10px 16px;
        background: #1c1c1c;
        border-bottom: 1px solid #333;
      }
      h1 {
        font-size: 16px;
        margin: 0 8px 0 0;
      }
      header div {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      select {
        font: inherit;
      }
      .legend {
        margin: 0;
        color: #999;
        font-size: 12px;
      }
      .legend b {
        color: #8cc8ff;
        font-weight: normal;
      }
      main {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      table {
        border-spacing: 0;
        min-width: 100%;
      }
      caption {
        text-align: left;
        padding: 12px 16px;
        color: #aaa;
      }
      th,
      td {
        padding: 10px 16px;
        border-bottom: 1px solid #333;
        border-right: 1px solid #333;
      }
      thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: #242424;
        min-width: 96px;
      }
      tbody th,
      thead th:first-child {
        position: sticky;
        left: 0;
        text-align: left;
        min-width: 170px;
        background: #1c1c1c;
      }
      tbody th {
        z-index: 1;
      }
      thead th:first-child {
        z-index: 3;
      }
      .terrain {
        color: #8cc8ff;
      }
      canvas {
        display: block;
        margin: auto;
        image-rendering: pixelated;
      }
      #status:empty {
        display: none;
      }
      #status {
        padding: 0 16px;
      }
      select,
      input {
        accent-color: #8cc8ff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Sprite sheet</h1>
      <div>
        <label for="set">Set</label>
        <select id="set"></select>
      </div>
      <div>
        <label for="ground">Ground</label>
        <select id="ground"></select>
      </div>
      <div>
        <label for="size">Size</label>
        <select id="size"></select>
      </div>
      <div>
        <input type="checkbox" id="frames" checked />
        <label for="frames">Frames</label>
      </div>
      <div>
        <input type="checkbox" id="animate" checked />
        <label for="animate">Animate</label>
      </div>
      <div>
        <input type="checkbox" id="grouped" checked />
        <label for="grouped">Variants with their monster</label>
      </div>
      <p class="legend">
        Names stay on the left; sets run across the columns. Scroll to compare.
        <b>Blue</b> names are terrain. Smaller images show the sheet frames.
      </p>
    </header>
    <p id="status" role="status"></p>
    <main id="sets" tabindex="0" aria-label="Sprite comparison table"></main>
    <script type="module" src="/src/tiles.ts"></script>
  </body>
</html>
